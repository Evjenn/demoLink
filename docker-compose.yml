version: '3.8'

services:

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres_container
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: ${DOCKER_DB_USERNAME}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rest-api-app:
    build: .
    container_name: spring_api_container
    ports:
      - "8080:8080"
    environment:

      DB_URL: jdbc:postgresql://postgres-db:5432/url_shortener
      DB_USERNAME: ${DOCKER_DB_USERNAME}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD}
      JWT_SECRET: ${DOCKER_JWT_SECRET}
    depends_on:
      - postgres-db

volumes:
  postgres_data: